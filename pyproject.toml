[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ice-school-schedule"
version = "0.1.0"
description = "Schedule, attendance and entitlement accounting for a figure skating school"
requires-python = ">=3.12"
dependencies = [
  "Django==5.2.17",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ice_school.settings"
python_files = ["test_*.py", "*_tests.py"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "ice_school*",
  "core*",
  "accounts*",
  "scheduling*",
  "attendance*",
  "subscriptions*",
  "audit*",
]
