<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ice School{% endblock %}</title>
</head>
<body>
  <header>
    <nav>
      <a href="{% url 'scheduling:home' %}">Главная</a>
      {% if request.user.is_authenticated %}
        <span>{{ request.user.username }}</span>
      {% endif %}
    </nav>
  </header>

  {% if messages %}
    <ul>
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
