name: Apply fix 33 lock order

on:
  push:
    branches:
      - fix/reschedule-resource-conflicts

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reschedule-resource-conflicts
          fetch-depth: 0
      - name: Apply exact lock-order patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("scheduling/services.py")
          text = path.read_text()
          replacements = [
              (
                  '''    TrainingGroup.objects.select_for_update().get(pk=source_ref.group_id)\n    CoachProfile.objects.select_for_update().get(pk=source_ref.coach_id)\n    Venue.objects.select_for_update().get(pk=source_ref.venue_id)\n    source = (\n        Lesson.objects.select_for_update()\n        .select_related("lesson_type")\n        .get(pk=lesson_id)\n    )\n    if (\n        source.group_id != source_ref.group_id\n        or source.coach_id != source_ref.coach_id\n        or source.venue_id != source_ref.venue_id\n    ):\n        raise ValidationError(\n            {"lesson": "Lesson scheduling resources changed concurrently. Retry."}\n        )\n''',
                  '''    TrainingGroup.objects.select_for_update().get(pk=source_ref.group_id)\n    CoachProfile.objects.select_for_update().get(pk=source_ref.coach_id)\n    source = (\n        Lesson.objects.select_for_update()\n        .select_related("lesson_type")\n        .get(pk=lesson_id)\n    )\n    if (\n        source.group_id != source_ref.group_id\n        or source.coach_id != source_ref.coach_id\n        or source.venue_id != source_ref.venue_id\n    ):\n        raise ValidationError(\n            {"lesson": "Lesson scheduling resources changed concurrently. Retry."}\n        )\n    Venue.objects.select_for_update().get(pk=source.venue_id)\n''',
              ),
              (
                  '''    conflicting_lessons = list(\n        Lesson.objects.select_for_update()\n        .filter(\n            Q(group_id=source.group_id)\n''',
                  '''    conflicting_lessons = list(\n        Lesson.objects.filter(\n            Q(group_id=source.group_id)\n''',
              ),
              (
                  '''        resource_conflicts = list(\n            Lesson.objects.select_for_update()\n            .filter(\n                Q(coach_id=template.coach_id)\n''',
                  '''        resource_conflicts = list(\n            Lesson.objects.filter(\n                Q(coach_id=template.coach_id)\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one match, got {count}: {old[:90]!r}"
                  )
              text = text.replace(old, new, 1)

          path.write_text(text)
          Path(".github/workflows/apply-fix-33-lock-order.yml").unlink()
      - name: Commit lock-order patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scheduling/services.py .github/workflows/apply-fix-33-lock-order.yml
          git diff --cached --check
          git commit -m "Avoid lesson resource lock inversion"
          git push origin HEAD:fix/reschedule-resource-conflicts
