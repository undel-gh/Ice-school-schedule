name: CI

on:
  push:
  pull_request:

jobs:
  deployment-script:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: ci-install-script-tests-only
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax and ShellCheck
        run: |
          bash -n install.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning install.sh
      - name: Exercise lifecycle safety and failure guards
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q ops/tests/test_install_script.py ops/tests/test_offsite_backup.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        school_time_zone:
          - UTC
          - Asia/Tokyo
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ice_school
          POSTGRES_USER: ice_school
          POSTGRES_PASSWORD: ice_school
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ice_school -d ice_school"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DJANGO_DEBUG: "1"
      SCHOOL_TIME_ZONE: ${{ matrix.school_time_zone }}
      DJANGO_TIME_ZONE: UTC
      POSTGRES_DB: ice_school
      POSTGRES_USER: ice_school
      POSTGRES_PASSWORD: ice_school
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python manage.py check
      - run: python manage.py makemigrations --check
      - run: pytest -q
      - name: Django deployment checks
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-deploy-check-secret-key-with-sufficient-length
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_SECURE_SSL_REDIRECT: "1"
          DJANGO_SECURE_HSTS_SECONDS: "3600"
        run: python manage.py check --deploy


  production-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare production environment
        run: |
          cp .env.production.example .env.production
          sed -i 's/school.example.com/ci.school.invalid/g' .env.production
          sed -i 's/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-production-strong-secret-not-for-real-use-1234567/' .env.production
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-production-strong-db-password-1234567/' .env.production
          chmod 600 .env.production
      - name: Validate optional encrypted offsite overlay
        run: |
          mkdir -p "$RUNNER_TEMP/ice-offsite-secrets"
          printf '%s\n' 'ci-only-restic-password' > "$RUNNER_TEMP/ice-offsite-secrets/password"
          printf '%s\n' '[default]' 'aws_access_key_id=ci' 'aws_secret_access_key=ci' > "$RUNNER_TEMP/ice-offsite-secrets/credentials"
          chmod 600 "$RUNNER_TEMP/ice-offsite-secrets/"*
          cp .env.production .env.offsite.ci
          {
            echo "OFFSITE_ENABLED=1"
            echo "OFFSITE_RESTIC_REPOSITORY=s3:https://s3.example.invalid/school-backups"
            echo "OFFSITE_RESTIC_PASSWORD_HOST_FILE=$RUNNER_TEMP/ice-offsite-secrets/password"
            echo "OFFSITE_AWS_CREDENTIALS_HOST_FILE=$RUNNER_TEMP/ice-offsite-secrets/credentials"
          } >> .env.offsite.ci
          chmod 600 .env.offsite.ci
          docker compose --env-file .env.offsite.ci \
            -f compose.production.yaml -f compose.offsite.yaml config --quiet
      - name: Build production image
        run: docker build -t ice-school-app:local .
      - name: Validate production Compose
        run: |
          docker compose \
            --env-file .env.production \
            -f compose.production.yaml \
            config >/dev/null
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e APP_HOST=school.example.com \
            -v "$PWD/ops/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.2-alpine \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Smoke production web and database
        run: |
          docker compose \
            --env-file .env.production \
            -f compose.production.yaml \
            up -d web

          web_id="$(
            docker compose \
              --env-file .env.production \
              -f compose.production.yaml \
              ps -q web
          )"

          for attempt in $(seq 1 40); do
            status="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                "$web_id"
            )"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker compose \
                --env-file .env.production \
                -f compose.production.yaml \
                logs web migrate db
              exit 1
            fi
            sleep 2
          done

          docker compose \
            --env-file .env.production \
            -f compose.production.yaml \
            logs web migrate db
          exit 1
      - name: Smoke scheduler
        run: |
          docker compose \
            --env-file .env.production \
            -f compose.production.yaml \
            up -d scheduler

          scheduler_id="$(
            docker compose \
              --env-file .env.production \
              -f compose.production.yaml \
              ps -q scheduler
          )"

          for attempt in $(seq 1 30); do
            logs="$(
              docker logs "$scheduler_id" 2>&1 || true
            )"
            lifecycle_ok="$(
              printf '%s' "$logs" | \
              grep -c 'job=subscription_lifecycle event=finish exit_code=0' || true
            )"
            generation_ok="$(
              printf '%s' "$logs" | \
              grep -c 'job=lesson_generation event=finish exit_code=0' || true
            )"
            if [ "$lifecycle_ok" -ge 1 ] && [ "$generation_ok" -ge 1 ]; then
              docker compose \
                --env-file .env.production \
                -f compose.production.yaml \
                exec -T scheduler \
                  /bin/sh /app/ops/scheduler_healthcheck.sh
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$scheduler_id")" != "true" ]; then
              docker logs "$scheduler_id"
              exit 1
            fi
            sleep 2
          done

          docker logs "$scheduler_id"
          exit 1
      - name: Smoke PostgreSQL backup service
        run: |
          docker compose \
            --env-file .env.production \
            -f compose.production.yaml \
            up -d backup

          backup_id="$(
            docker compose \
              --env-file .env.production \
              -f compose.production.yaml \
              ps -q backup
          )"

          for attempt in $(seq 1 40); do
            status="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                "$backup_id"
            )"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs "$backup_id"
              exit 1
            fi
            sleep 2
          done

          status="$(
            docker inspect \
              --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
              "$backup_id"
          )"
          if [ "$status" != "healthy" ]; then
            docker logs "$backup_id"
            exit 1
          fi

          test -n "$(find backups -maxdepth 1 -name 'ice_school_*.dump' -print -quit)"

          docker compose \
            --env-file .env.production \
            -f compose.production.yaml \
            exec -T backup /ops/postgres_backup.sh --once
      - name: Smoke PostgreSQL backup timeout
        run: |
          docker compose \
            --env-file .env.production \
            -f compose.production.yaml \
            exec -T backup sh -c \
              'mkdir -p /tmp/backup-timeout-test && printf "#!/bin/sh\\nsleep 10\\n" > /tmp/backup-timeout-test/pg_dump && chmod +x /tmp/backup-timeout-test/pg_dump'

          set +e
          output="$(
            docker compose \
              --env-file .env.production \
              -f compose.production.yaml \
              exec -T \
              -e BACKUP_TIMEOUT_SECONDS=1 \
              -e PATH=/tmp/backup-timeout-test:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              backup /ops/postgres_backup.sh --once 2>&1
          )"
          status=$?
          set -e

          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -q 'event=failed stage=pg_dump'
          printf '%s\n' "$output" | grep -q 'timeout_seconds=1'
          test -z "$(find backups -maxdepth 1 -name '*.partial' -print -quit)"
      - name: Smoke PostgreSQL restore
        run: |
          set -a
          . ./.env.production
          set +a

          dump="$(
            find backups -maxdepth 1 -name 'ice_school_*.dump' \
              -type f -print | sort | tail -n 1
          )"
          test -n "$dump"

          docker compose \
            --env-file .env.production \
            -f compose.production.yaml \
            exec -T db dropdb \
              --if-exists \
              -U "$POSTGRES_USER" \
              ice_school_restore_ci

          docker compose \
            --env-file .env.production \
            -f compose.production.yaml \
            exec -T db createdb \
              -U "$POSTGRES_USER" \
              ice_school_restore_ci

          dump_name="$(basename "$dump")"

          docker compose \
            --env-file .env.production \
            -f compose.production.yaml \
            run --rm --no-deps -T backup \
              cat "/backups/$dump_name" | \
            docker compose \
              --env-file .env.production \
              -f compose.production.yaml \
              exec -T db pg_restore \
                --no-owner \
                --no-privileges \
                -U "$POSTGRES_USER" \
                -d ice_school_restore_ci

          migration_count="$(
            docker compose \
              --env-file .env.production \
              -f compose.production.yaml \
              exec -T db psql \
                -U "$POSTGRES_USER" \
                -d ice_school_restore_ci \
                -Atqc 'SELECT COUNT(*) FROM django_migrations;'
          )"
          test "$migration_count" -gt 0

          docker compose \
            --env-file .env.production \
            -f compose.production.yaml \
            exec -T db dropdb \
              -U "$POSTGRES_USER" \
              ice_school_restore_ci
      - name: Smoke production lifecycle script with live Docker
        run: |
          ./install.sh update --ref "$GITHUB_SHA"
          ./install.sh status
          ./install.sh reinstall
          ./install.sh uninstall
          test -f .env.production
          test -n "$(find backups -maxdepth 1 -name 'ice_school_*.dump' -print -quit)"
          ./install.sh install
          ./install.sh status
      - name: Smoke encrypted restic backup and independent full restore
        env:
          BACKUP_SOURCE_DIR: ${{ github.workspace }}/backups
        run: |
          bash -n ops/tests/smoke_offsite_restore.sh
          bash ops/tests/smoke_offsite_restore.sh
      - name: Stop production smoke stack
        if: always()
        run: |
          docker compose \
            --env-file .env.production \
            -f compose.production.yaml \
            down -v --remove-orphans
