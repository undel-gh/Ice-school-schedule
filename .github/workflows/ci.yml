name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        school_time_zone:
          - UTC
          - Asia/Tokyo
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ice_school
          POSTGRES_USER: ice_school
          POSTGRES_PASSWORD: ice_school
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ice_school -d ice_school"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DJANGO_DEBUG: "1"
      SCHOOL_TIME_ZONE: ${{ matrix.school_time_zone }}
      DJANGO_TIME_ZONE: UTC
      POSTGRES_DB: ice_school
      POSTGRES_USER: ice_school
      POSTGRES_PASSWORD: ice_school
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python manage.py check
      - run: python manage.py makemigrations --check
      - run: pytest -q
      - name: Django deployment checks
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-deploy-check-secret-key-with-sufficient-length
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_SECURE_SSL_REDIRECT: "1"
          DJANGO_SECURE_HSTS_SECONDS: "3600"
        run: python manage.py check --deploy


  production-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare production environment
        run: cp .env.production.example .env.production
      - name: Build production image
        run: docker build -t ice-school-app:local .
      - name: Validate production Compose
        run: |
          docker compose \
            --env-file .env.production \
            -f compose.production.yaml \
            config >/dev/null
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e APP_HOST=school.example.com \
            -v "$PWD/ops/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.2-alpine \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Smoke production web and database
        run: |
          docker compose \
            --env-file .env.production \
            -f compose.production.yaml \
            up -d web

          web_id="$(
            docker compose \
              --env-file .env.production \
              -f compose.production.yaml \
              ps -q web
          )"

          for attempt in $(seq 1 40); do
            status="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                "$web_id"
            )"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker compose \
                --env-file .env.production \
                -f compose.production.yaml \
                logs web migrate db
              exit 1
            fi
            sleep 2
          done

          docker compose \
            --env-file .env.production \
            -f compose.production.yaml \
            logs web migrate db
          exit 1
      - name: Smoke scheduler
        run: |
          docker compose \
            --env-file .env.production \
            -f compose.production.yaml \
            up -d scheduler

          scheduler_id="$(
            docker compose \
              --env-file .env.production \
              -f compose.production.yaml \
              ps -q scheduler
          )"

          for attempt in $(seq 1 30); do
            logs="$(
              docker logs "$scheduler_id" 2>&1 || true
            )"
            lifecycle_ok="$(
              printf '%s' "$logs" | \
              grep -c 'job=subscription_lifecycle event=finish exit_code=0' || true
            )"
            generation_ok="$(
              printf '%s' "$logs" | \
              grep -c 'job=lesson_generation event=finish exit_code=0' || true
            )"
            if [ "$lifecycle_ok" -ge 1 ] && [ "$generation_ok" -ge 1 ]; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$scheduler_id")" != "true" ]; then
              docker logs "$scheduler_id"
              exit 1
            fi
            sleep 2
          done

          docker logs "$scheduler_id"
          exit 1
      - name: Smoke PostgreSQL backup service
        run: |
          docker compose \
            --env-file .env.production \
            -f compose.production.yaml \
            up -d backup

          backup_id="$(
            docker compose \
              --env-file .env.production \
              -f compose.production.yaml \
              ps -q backup
          )"

          for attempt in $(seq 1 40); do
            status="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                "$backup_id"
            )"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs "$backup_id"
              exit 1
            fi
            sleep 2
          done

          status="$(
            docker inspect \
              --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
              "$backup_id"
          )"
          if [ "$status" != "healthy" ]; then
            docker logs "$backup_id"
            exit 1
          fi

          test -n "$(find backups -maxdepth 1 -name 'ice_school_*.dump' -print -quit)"

          docker compose \
            --env-file .env.production \
            -f compose.production.yaml \
            exec -T backup /ops/postgres_backup.sh --once
      - name: Stop production smoke stack
        if: always()
        run: |
          docker compose \
            --env-file .env.production \
            -f compose.production.yaml \
            down -v --remove-orphans
