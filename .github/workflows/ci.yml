name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ice_school
          POSTGRES_USER: ice_school
          POSTGRES_PASSWORD: ice_school
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ice_school -d ice_school"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DJANGO_DEBUG: "1"
      SCHOOL_TIME_ZONE: Europe/Riga
      POSTGRES_DB: ice_school
      POSTGRES_USER: ice_school
      POSTGRES_PASSWORD: ice_school
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python manage.py check
      - run: python manage.py makemigrations --check
      - run: pytest -q
      - name: Django deployment checks
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-deploy-check-secret-key-with-sufficient-length
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_SECURE_SSL_REDIRECT: "1"
          DJANGO_SECURE_HSTS_SECONDS: "3600"
        run: python manage.py check --deploy
