name: Apply issue 33 patch

on:
  push:
    branches:
      - fix/scheduling-resource-conflicts
    paths:
      - .github/issue33_apply.py
      - .github/workflows/apply-issue33-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scheduling-resource-conflicts
      - name: Apply deterministic source update
        run: python .github/issue33_apply.py
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scheduling/services.py core/ui_messages.py core/tests/test_error_localization_coverage.py
          git commit -m "Prevent coach and venue double booking"
          git push origin HEAD:fix/scheduling-resource-conflicts
