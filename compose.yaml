services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ice_school
      POSTGRES_USER: ice_school
      POSTGRES_PASSWORD: ice_school
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ice_school -d ice_school"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
